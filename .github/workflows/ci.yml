name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  django-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mmp_ci
          POSTGRES_USER: mmp_ci
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmp_ci -d mmp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "0"
      SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-not-for-production
      ALLOWED_HOSTS: 127.0.0.1,localhost
      POSTGRES_DB: mmp_ci
      POSTGRES_USER: mmp_ci
      POSTGRES_PASSWORD: ci-database-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: python manage.py test --verbosity 2
      - run: python manage.py collectstatic --noinput
      - name: Check JavaScript syntax
        run: for file in assets/core/*.js; do node --check "$file"; done

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure CI deployment
        run: |
          cp .env.example .env
          sed -i 's|replace-with-a-long-random-secret|ci-only-secret-key-with-more-than-fifty-characters-not-for-production|' .env
          sed -i 's|replace-with-a-strong-database-password|ci-database-password|' .env
          sed -i 's|replace-with-a-strong-admin-password|CI-Admin-Pass1234!|' .env
      - name: Build and start Compose stack
        run: docker compose up -d --build
      - name: Wait for HTTP and verify services
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/login/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose ps
              docker compose logs --tail=200
              exit 1
            fi
            sleep 2
          done
          docker compose exec -T web python manage.py check
          docker compose exec -T web python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/login/', timeout=3).status == 200"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes
