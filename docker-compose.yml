x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    pids_limit: 256
    logging: *default-logging
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  maintenance:
    build: .
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    logging: *default-logging
    env_file: .env
    depends_on:
      web:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          python manage.py purge_relationship_map_trash
          sleep "$${MAINTENANCE_INTERVAL_SECONDS:-86400}"
        done

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    logging: *default-logging
    environment: &backup-environment
      APP_VERSION: ${APP_VERSION:-unknown}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    depends_on:
      db:
        condition: service_healthy
      backup_verify:
        condition: service_healthy
    volumes:
      - backup_data:/backups
      - media_data:/media:ro
      - ./deploy/backup-worker.sh:/opt/backup-worker.sh:ro
    networks: [default, backup_verification]
    entrypoint: ["/bin/sh", "/opt/backup-worker.sh"]
    command: ["watch"]
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/backup-worker.sh", "health"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 2m

  # Disposable verification server: no production volumes or published ports.
  backup_verify:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    environment:
      POSTGRES_USER: backup_verify
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs: [/var/lib/postgresql/data]
    networks: [backup_verification]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backup_verify -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  restore:
    image: postgres:16-alpine
    profiles: [tools]
    init: true
    security_opt: [no-new-privileges:true]
    environment: *backup-environment
    volumes:
      - backup_data:/backups
      - media_data:/media
      - ./deploy/backup-worker.sh:/opt/backup-worker.sh:ro
    networks: [default, backup_verification]
    entrypoint: ["/bin/sh", "/opt/backup-worker.sh"]

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    pids_limit: 128
    logging: *default-logging
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro

volumes:
  postgres_data:
  static_data:
  media_data:
  backup_data:

networks:
  backup_verification:
    internal: true
