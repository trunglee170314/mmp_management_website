x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    pids_limit: 256
    logging: *default-logging
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  maintenance:
    build: .
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    logging: *default-logging
    env_file: .env
    depends_on:
      web:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          python manage.py purge_relationship_map_trash
          sleep "$${MAINTENANCE_INTERVAL_SECONDS:-86400}"
        done

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backup_data:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        mkdir -p /backups
        while true; do
          stamp=$$(date +%Y%m%d-%H%M%S)
          partial="/backups/postgres-$${stamp}.dump.partial"
          final="/backups/postgres-$${stamp}.dump"
          if pg_dump -h db -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Fc -f "$${partial}" && pg_restore --list "$${partial}" >/dev/null; then
            mv "$${partial}" "$${final}"
            date +%s > /backups/.last-success
            rm -f /backups/.last-failure
            echo "Backup created: $${final}"
            find /backups -type f -name 'postgres-*.dump' -mtime "+$${BACKUP_RETENTION_DAYS}" -delete
          else
            rm -f "$${partial}"
            date -Iseconds > /backups/.last-failure
            echo "PostgreSQL backup failed" >&2
            sleep 60
            exit 1
          fi
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/.last-success && age=$$(( $$(date +%s) - $$(cat /backups/.last-success) )); test $$age -lt $$(( $${BACKUP_INTERVAL_SECONDS} + 3600 ))"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 2m

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    pids_limit: 128
    logging: *default-logging
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro

volumes:
  postgres_data:
  static_data:
  media_data:
  backup_data:
