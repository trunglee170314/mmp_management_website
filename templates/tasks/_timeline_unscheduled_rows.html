{% for task in unscheduled_tasks %}<tr data-unscheduled-row="{{ task.pk }}"><td><button type="button" class="timeline-task-name" data-edit-task="{{ task.pk }}" data-edit-action="{% url 'task_edit' task.pk %}">{{ task.title }}</button></td><td>{% for scope in task.scope_list %}<span class="tag"><i style="background:{{ scope.color }}"></i>{{ scope.name }}</span>{% empty %}—{% endfor %}</td><td>{{ task.assignee|default:'Unassigned' }}</td><td><span class="status {{ task.status }}">{{ task.get_status_display }}</span></td><td><button type="button" data-edit-task="{{ task.pk }}" data-edit-action="{% url 'task_edit' task.pk %}">Schedule</button></td></tr>{% endfor %}
